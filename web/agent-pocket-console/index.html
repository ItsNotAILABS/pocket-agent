<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agent Pocket Console</title>
  <style>
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#06080f; color:#f8fafc; }
    main { max-width:1040px; margin:0 auto; padding:44px 18px; }
    section { border:1px solid #263244; border-radius:26px; background:#0f172a; padding:28px; }
    h1 { font-size:clamp(34px,7vw,72px); line-height:.95; letter-spacing:-.05em; margin:0 0 16px; }
    p { color:#94a3b8; line-height:1.6; }
    input, textarea, select { width:100%; border:1px solid #263244; background:#020617; color:#e2e8f0; border-radius:14px; padding:12px; margin:8px 0; font:inherit; }
    textarea { min-height:130px; }
    button { border:1px solid #263244; background:#111827; color:#f8fafc; padding:12px 14px; border-radius:14px; cursor:pointer; }
    pre { white-space:pre-wrap; background:#020617; border:1px dashed #263244; border-radius:16px; padding:14px; color:#cbd5e1; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Agent Pocket Console</h1>
      <p>Create explicit agent tasks with operator approval flags, expected outputs, policy mode, and receipt-first execution. This page does not silently run privileged work.</p>
      <input id="title" value="Improve Pocket beta route handoff" />
      <textarea id="instructions">Create a scoped improvement, produce artifacts, and return a receipt.</textarea>
      <select id="mode"><option value="agent_task">agent_task</option><option value="production_claim">production_claim</option><option value="data_export">data_export</option><option value="payment_execution">payment_execution</option><option value="wallet_execution">wallet_execution</option></select>
      <label><input id="approval" type="checkbox" /> operator approval granted</label>
      <p><button id="make">Build agent task packet</button></p>
      <pre id="out">No packet yet.</pre>
    </section>
  </main>
  <script type="module">
    import { AgentPocketClient } from '../../sdk/pocket-agent-client.js';
    const client = new AgentPocketClient({ baseUrl: 'https://beta.pocketnova.app' });
    document.getElementById('make').onclick = async () => {
      const packet = await client.localTaskPacket({
        task_id: `task_${Date.now()}`,
        type: document.getElementById('mode').value,
        title: document.getElementById('title').value,
        instructions: document.getElementById('instructions').value,
        operator_approval: document.getElementById('approval').checked,
        expected_outputs: ['artifact', 'receipt', 'handoff']
      });
      document.getElementById('out').textContent = JSON.stringify(packet, null, 2);
    };
  </script>
</body>
</html>
