[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-agent"
version = "0.3.0"
description = "POCKET Agent — long-running execution, continual harnesses, WASM capsules, and approval-bound runtime cells"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ItsNotAI Labs" }]
keywords = ["agent", "rlm", "rah", "wasm", "capsule", "pocket", "harness", "long-running", "autonomous-agent", "runtime-cell", "approval", "sandbox"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
host = []

[project.scripts]
pocket-agent = "pocket_agent.cli:main"

[project.urls]
Homepage = "https://github.com/ItsNotAILABS/pocket-agent"
Repository = "https://github.com/ItsNotAILABS/pocket-agent"
Issues = "https://github.com/ItsNotAILABS/pocket-agent/issues"
POCKET = "https://github.com/ItsNotAILABS/pocket"
Voice = "https://github.com/ItsNotAILABS/pocket-voice-to-text"
NEXUS = "https://github.com/ItsNotAILABS/nexus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
