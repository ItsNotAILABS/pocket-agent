    <circle cx="1080" cy="252" r="84" stroke-width="3"/>
    <circle cx="1080" cy="252" r="130" opacity=".5"/>
    <path d="M1000 252h160M1080 172v160" opacity=".65"/>
    <path d="M1080 168c78 20 108 90 72 148-34 55-104 72-156 37-50-34-65-102-31-151 27-40 70-55 115-34Z" stroke="#818cf8" stroke-width="3"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc">
    <text x="92" y="172" font-size="74" font-weight="800" letter-spacing="-2">POCKET Agent</text>
    <text x="96" y="226" font-size="26" fill="#a7f3d0">Long-running intelligence that can leave the prompt, work, return, and continue.</text>
    <text x="96" y="294" font-size="21" fill="#cbd5e1">RLM · continual harness · recursive agents · schedules · goals · WASM capsules</text>
