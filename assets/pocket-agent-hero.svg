<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">POCKET Agent</title>
  <desc id="desc">A long-running agent harness with recursive execution, persistent state, and isolated capsules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111b34"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#6ee7b7"/><stop offset=".5" stop-color="#22c55e" stop-opacity=".45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <g opacity=".18" stroke="#7dd3fc"><path d="M0 96H1400M0 176H1400M0 256H1400M0 336H1400M0 416H1400"/><path d="M140 0V520M280 0V520M420 0V520M560 0V520M700 0V520M840 0V520M980 0V520M1120 0V520M1260 0V520"/></g>
