<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">POCKET Agent architecture</title><desc id="desc">Goal and session state feed an RLM controller, recursive agent harness, tools, schedules, and isolated capsules, with receipts returning to POCKET.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10172d"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="70" y="78" fill="#f8fafc" font-size="38" font-weight="800">One agent session. Multiple execution planes.</text><text x="72" y="116" fill="#94a3b8" font-size="20">POCKET Agent keeps goals and state durable while work fans out through bounded harnesses and capsules.</text></g>
  <g stroke-width="2" fill="#0f172a">
    <rect x="80" y="185" width="260" height="120" rx="20" stroke="#38bdf8"/><rect x="415" y="165" width="290" height="160" rx="22" stroke="#6ee7b7"/><rect x="790" y="150" width="250" height="100" rx="20" stroke="#818cf8"/><rect x="790" y="280" width="250" height="100" rx="20" stroke="#f59e0b"/><rect x="1115" y="185" width="205" height="120" rx="20" stroke="#22c55e"/>
    <rect x="415" y="420" width="290" height="130" rx="22" stroke="#f472b6"/><rect x="80" y="420" width="260" height="130" rx="22" stroke="#64748b"/><rect x="790" y="435" width="250" height="100" rx="20" stroke="#a78bfa"/><rect x="1115" y="420" width="205" height="130" rx="20" stroke="#34d399"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f8fafc"><text x="112" y="225" font-size="24" font-weight="700">Goal + Session</text><text x="112" y="258" fill="#94a3b8" font-size="17">cwd · memories · budget</text><text x="112" y="284" fill="#94a3b8" font-size="17">detach / resume</text>
    <text x="455" y="212" font-size="27" font-weight="800">RLM Controller</text><text x="455" y="248" fill="#a7f3d0" font-size="17">context as variables</text><text x="455" y="276" fill="#a7f3d0" font-size="17">tools as functions</text><text x="455" y="304" fill="#a7f3d0" font-size="17">persistent control loop</text>
    <text x="825" y="190" font-size="23" font-weight="700">RAH</text><text x="825" y="222" fill="#c4b5fd" font-size="17">recursive full agents</text><text x="825" y="320" font-size="23" font-weight="700">Tools + Shell</text><text x="825" y="352" fill="#fcd34d" font-size="17">files · commands · SDK</text>
    <text x="1142" y="226" font-size="23" font-weight="700">Result</text><text x="1142" y="258" fill="#86efac" font-size="17">reviewable output</text>
    <text x="112" y="466" font-size="23" font-weight="700">Continual Harness</text><text x="112" y="500" fill="#cbd5e1" font-size="17">supplemental lessons</text><text x="112" y="526" fill="#cbd5e1" font-size="17">snapshots + rollback</text>
    <text x="455" y="465" font-size="25" font-weight="800">WASM Capsules</text><text x="455" y="499" fill="#f9a8d4" font-size="17">bounded isolated runspaces</text><text x="455" y="526" fill="#f9a8d4" font-size="17">20 named spin reasons</text>
    <text x="825" y="476" font-size="23" font-weight="700">Daemon + Schedule</text><text x="825" y="508" fill="#ddd6fe" font-size="17">heartbeat · re-entry</text>
    <text x="1142" y="463" font-size="23" font-weight="700">Receipts</text><text x="1142" y="497" fill="#a7f3d0" font-size="17">status · timestamps</text><text x="1142" y="523" fill="#a7f3d0" font-size="17">hashes · runtime</text></g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#none)"><path d="M340 245H415"/><path d="M705 225H790"/><path d="M705 275L790 330"/><path d="M1040 225H1115"/><path d="M560 325V420"/><path d="M415 485H340"/><path d="M705 485H790"/><path d="M1040 485H1115"/></g>
