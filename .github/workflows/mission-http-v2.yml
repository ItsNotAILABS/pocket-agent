name: Mission HTTP v2

on:
  pull_request:
    paths:
      - 'src/pocket_agent/mission_http.py'
      - 'src/pocket_agent/mission_program.py'
      - 'tests/test_mission_http_v2.py'
      - '.github/workflows/mission-http-v2.yml'
  push:
    branches: [master]
    paths:
      - 'src/pocket_agent/mission_http.py'
      - 'src/pocket_agent/mission_program.py'
      - 'tests/test_mission_http_v2.py'
      - '.github/workflows/mission-http-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e .
      - run: python -m py_compile src/pocket_agent/mission_http.py
      - run: python -m pytest -q tests/test_mission_http_v2.py
      - name: Verify remote bind fails closed without a strong token
        run: |
          ! env -u POCKET_MISSION_API_TOKEN python -m pocket_agent.mission_http --host 0.0.0.0 --port 8792
      - name: Emit source evidence
        run: |
          mkdir -p artifacts/mission-http-v2
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [
              'src/pocket_agent/mission_http.py',
              'tests/test_mission_http_v2.py',
          ]
          payload = {
              'schema': 'pocket.mission-http.source-evidence.v2',
              'evidence_class': 'E3-validated-output',
              'files': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
              'validated': [
                  'bearer authentication',
                  'explicit principal and tenant identity',
                  'cross-tenant denial',
                  'program creation',
                  'bounded mission execution',
                  'artifact listing',
                  'non-loopback token requirement',
              ],
              'claim_boundary': (
                  'This validates a loopback test server and source behavior, not a deployed, '
                  'load-tested, externally authenticated, production API.'
              ),
          }
          payload['receipt_sha256'] = hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          Path('artifacts/mission-http-v2/source-evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mission-http-v2-evidence
          path: artifacts/mission-http-v2
          if-no-files-found: error
