name: Mission Auth v2

on:
  pull_request:
    paths:
      - 'src/pocket_agent/mission_auth.py'
      - 'src/pocket_agent/mission_http_secure.py'
      - 'tests/test_mission_auth_v2.py'
      - '.github/workflows/mission-auth-v2.yml'
  push:
    branches: [master]
    paths:
      - 'src/pocket_agent/mission_auth.py'
      - 'src/pocket_agent/mission_http_secure.py'
      - 'tests/test_mission_auth_v2.py'
      - '.github/workflows/mission-auth-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install -e .
      - run: |
          python -m py_compile \
            src/pocket_agent/mission_auth.py \
            src/pocket_agent/mission_http_secure.py
      - run: python -m pytest -q tests/test_mission_auth_v2.py
      - name: Verify registry contains hashes, not raw tokens
        run: |
          python - <<'PY'
          import json
          from pocket_agent.mission_auth import key_registry_document
          token = 'ci-secret-' + 'x' * 32
          document = key_registry_document([{
              'key_id': 'ci',
              'token': token,
              'principal_id': 'ci-user',
              'tenant_id': 'ci-tenant',
              'scopes': ['mission:read'],
          }])
          encoded = json.dumps(document)
          assert token not in encoded
          assert len(document['keys'][0]['token_sha256']) == 64
          print('digest-only registry: PASS')
          PY
