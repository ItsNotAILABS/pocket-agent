name: pocket-agent-ci

on:
  push:
    branches: [master, main, "alpha-intelligence-practical-v1"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python info
        run: python --version
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
      - name: Import and capability smoke test
        run: |
          python - <<'PY'
          import pocket_agent
          from pocket_agent import capability_descriptor, Budget, route_capability
          assert pocket_agent.__version__ == "0.2.0"
          assert capability_descriptor()["component"] == "pocket-agent"
          assert Budget().to_protocol()["schema"] == "nexus.budget.v1"
          assert route_capability("run agent", [{"component":"pocket-agent","role":"execution","actions":["agent.run"]}])["selected"] == "pocket-agent"
          print("POCKET Agent Alpha import gate passed")
          PY
